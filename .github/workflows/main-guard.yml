# Flags any push to main not made by Chime (D-22). GitHub Free can't protect a branch of a
# private repo, so this is the alarm, not the lock: it opens an issue assigned to Chime and
# fails, so the push shows red. Merges Chime makes from a pull request run as Chime and pass.
name: Main guard

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  flag:
    if: github.actor != 'ChimeXXD'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open an issue for Chime
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          COMPARE: ${{ github.event.compare }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --assignee ChimeXXD \
            --title "Direct push to main by $ACTOR" \
            --body "$ACTOR pushed to main without a pull request (CONTRIBUTING.md, D-22).

          Commit: $SHA
          Changes: $COMPARE

          Review it, then keep it or revert it with \`git revert $SHA\`."
          echo "::error::Pushes to main go through a pull request that Chime merges. See CONTRIBUTING.md."
          exit 1
